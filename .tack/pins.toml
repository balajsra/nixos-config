# tack pins
# edit by hand or with tack add / rm / alias
# nix reads pins.lock.json
# this file drives tack update

# shorturl schemes
# scheme rest expands rest into {path}
[shorturls]
gh = "github:{path}"
gh-ssh = "git+ssh://git@github.com/{path}"

# all_follow maps input names to the top-level pin they follow
# opt out per-input with exclude_follow
[all_follow]
nixpkgs = "nixpkgs"
flake-parts = "flake-parts"

# inputs.<name> fields
#   url             required, shorturl ok, ?rev=<sha> pins an exact commit
#   type            flake (default), fetch, or fixed
#   flake           legacy false means type = "fetch"
#   follows         { child = "pin" } override map
#   exclude_follow  all_follow names to skip
#   dir             subdir holding flake.nix
#   submodules      fetch git submodules
#   unpack          fixed-only tarball or file
[inputs]

##############
# Nix Config #
##############
# Nix Packages
# Unstable by default
[inputs.nixpkgs]
url = "gh:nixos/nixpkgs/nixos-unstable"
group = "nix-config"

# Any version of any nixpkgs package, from one flake input
[inputs.multiverse]
url = "gh:fzakaria/nixpkgs-multiverse"
group = "nix-config"

# Dendritic Pattern Support (Flake Parts)
[inputs.flake-parts]
url = "gh:hercules-ci/flake-parts"
group = "nix-config"

# Dendritic Pattern Support (Import Tree)
[inputs.import-tree]
url = "gh:vic/import-tree"
group = "nix-config"

# Home Manager
[inputs.home-manager]
url = "gh:nix-community/home-manager"
group = "nix-config"

# Declarative disk partitioning and formatting
[inputs.disko]
url = "gh:nix-community/disko"
group = "nix-config"

# Full-featured, user-focused pinning system for nix inputs
[inputs.tack]
url = "gh:manic-systems/tack"
exclude_follow = ["nixpkgs"]
group = "nix-config"

# Secrets Management
[inputs.sops-nix]
url = "gh:mic92/sops-nix"
group = "nix-config"

################
# Applications #
################
# Automatic CPU Speed & Power Optimizer
[inputs.auto-cpufreq]
url = "gh:AdnanHodzic/auto-cpufreq"
tag = "v{version}"
group = "applications"

# File Manager for Dux Shell
[inputs.dux-files]
url = "gh:duxlabs-dev/dux-files"
tag = "v{version}"
group = "applications"

# Hytale Launcher
[inputs.hytale-launcher]
url = "gh:JPyke3/hytale-launcher-nix"
group = "applications"

# Zen Browser
[inputs.zen-browser]
url = "gh:youwen5/zen-browser-flake"
group = "applications"

###########
# Desktop #
###########
# Display Manager for Dux Shell
[inputs.dux-greeter]
url = "gh:duxlabs-dev/dux-greeter"
tag = "v{version}"
group = "desktop"

# Desktop Shell for Wayland Compositors
[inputs.dux-shell]
url = "gh:duxlabs-dev/dux-shell"
tag = "v{version}"
group = "desktop"

# Search interface for Dux Shell
[inputs.dux-search]
url = "gh:duxlabs-dev/dux-search"
tag = "v{version}"
group = "desktop"

# Mango Wayland Compositor
[inputs.mango]
url = "gh:mangowm/mango"
tag = "{version}"
group = "desktop"

